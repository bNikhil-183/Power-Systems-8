<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Bus Matrix Portal</title>
    <!-- Math.js for complex number and matrix operations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --panel-bg: #ffffff;
            --primary: #2563eb;
            --text-main: #1f2937;
            --border: #e5e7eb;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
            height: 100vh;
            box-sizing: border-box;
        }
        .panel {
            background: var(--panel-bg);
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            overflow-y: auto;
        }
        .controls {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
        }
        .display {
            flex: 2;
        }
        h2 { margin-top: 0; }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9em;
        }
        select, input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
        }
        .complex-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .complex-input input {
            flex: 1;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #1d4ed8; }
        #log {
            margin-top: 20px;
            padding: 10px;
            background: #eef2ff;
            color: #3730a3;
            border-radius: 4px;
            font-size: 0.9em;
            word-wrap: break-word;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 12px;
            text-align: center;
            font-family: monospace;
            font-size: 1.1em;
        }
        th { background-color: #f8fafc; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="panel controls">
        <h2>Network Modifications</h2>
        
        <div class="form-group">
            <label for="mod-type">Select Modification Type:</label>
            <select id="mod-type" onchange="updateFormUI()">
                <option value="1">Type 1 (Add NEW bus to REF bus)</option>
                <option value="2">Type 2 (Add NEW bus to EXISTING bus)</option>
                <option value="3">Type 3 (EXISTING bus to REF bus)</option>
                <option value="4">Type 4 (Between TWO EXISTING buses)</option>
            </select>
        </div>

        <div class="form-group hidden" id="group-j">
            <label for="bus-j">Existing Bus (j):</label>
            <input type="number" id="bus-j" min="1" step="1">
        </div>

        <div class="form-group hidden" id="group-k">
            <label for="bus-k">Existing Bus (k):</label>
            <input type="number" id="bus-k" min="1" step="1">
        </div>

        <div class="form-group">
            <label>Branch Impedance (Zb):</label>
            <div class="complex-input">
                <input type="number" id="zb-real" step="0.0001" placeholder="Real (R)" value="0">
                <span>+ j</span>
                <input type="number" id="zb-imag" step="0.0001" placeholder="Reactance (X)">
            </div>
        </div>

        <button onclick="applyModification()">Apply Modification</button>
        <button onclick="resetSystem()" style="background-color: #dc2626;">Reset System</button>

        <div id="log">System initialized. Ready for Type 1 modification.</div>
    </div>

    <div class="panel display">
        <h2>Z-Bus Matrix</h2>
        <div id="matrix-container">
            <p style="color: #6b7280;">Matrix is empty.</p>
        </div>
    </div>

    <script>
        let Z = [];
        let busCount = 0;

        function updateFormUI() {
            const type = document.getElementById('mod-type').value;
            document.getElementById('group-j').classList.toggle('hidden', type === '1');
            document.getElementById('group-k').classList.toggle('hidden', type !== '4');
        }

        function logMsg(msg, isError = false) {
            const logDiv = document.getElementById('log');
            logDiv.innerText = msg;
            logDiv.style.backgroundColor = isError ? '#fef2f2' : '#eef2ff';
            logDiv.style.color = isError ? '#991b1b' : '#3730a3';
        }

        function renderMatrix() {
            const container = document.getElementById('matrix-container');
            if (busCount === 0) {
                container.innerHTML = '<p style="color: #6b7280;">Matrix is empty.</p>';
                return;
            }

            let html = '<table><thead><tr><th></th>';
            for (let i = 1; i <= busCount; i++) html += `<th>Bus ${i}</th>`;
            html += '</tr></thead><tbody>';

            for (let r = 0; r < busCount; r++) {
                html += `<tr><th>Bus ${r + 1}</th>`;
                for (let c = 0; c < busCount; c++) {
                    const val = Z[r][c];
                    const re = val.re.toFixed(4);
                    const im = val.im.toFixed(4);
                    const sign = im >= 0 ? '+' : '-';
                    html += `<td>${re} ${sign} j${Math.abs(im).toFixed(4)}</td>`;
                }
                html += '</tr>';
            }
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function resetSystem() {
            Z = [];
            busCount = 0;
            logMsg("System reset. Matrix is empty.");
            renderMatrix();
        }

        function applyModification() {
            const type = document.getElementById('mod-type').value;
            const re = parseFloat(document.getElementById('zb-real').value) || 0;
            const im = parseFloat(document.getElementById('zb-imag').value) || 0;
            const zb = math.complex(re, im);

            if (re === 0 && im === 0) {
                logMsg("Impedance cannot be zero.", true);
                return;
            }

            if (type === '1') {
                if (busCount === 0) {
                    Z = [[zb]];
                } else {
                    for (let i = 0; i < busCount; i++) Z[i].push(math.complex(0, 0));
                    let newRow = Array(busCount + 1).fill(math.complex(0, 0));
                    newRow[busCount] = zb;
                    Z.push(newRow);
                }
                busCount++;
                logMsg("Type 1 Modification Applied.");
            } 
            else {
                if (busCount === 0) {
                    logMsg("System is empty. Start with Type 1.", true);
                    return;
                }
                
                const j = parseInt(document.getElementById('bus-j').value) - 1;
                if (isNaN(j) || j < 0 || j >= busCount) {
                    logMsg("Invalid Existing Bus (j).", true);
                    return;
                }

                if (type === '2') {
                    for (let i = 0; i < busCount; i++) Z[i].push(Z[i][j]);
                    let newRow = [];
                    for (let i = 0; i < busCount; i++) newRow.push(Z[j][i]);
                    newRow.push(math.add(Z[j][j], zb));
                    Z.push(newRow);
                    busCount++;
                    logMsg(`Type 2 Modification Applied (New Bus to Bus ${j + 1}).`);
                } 
                else if (type === '3') {
                    const denom = math.add(Z[j][j], zb);
                    let Z_new = [];
                    for (let r = 0; r < busCount; r++) {
                        let row = [];
                        for (let c = 0; c < busCount; c++) {
                            const delta = math.divide(math.multiply(Z[r][j], Z[j][c]), denom);
                            row.push(math.subtract(Z[r][c], delta));
                        }
                        Z_new.push(row);
                    }
                    Z = Z_new;
                    logMsg(`Type 3 Modification Applied (Bus ${j + 1} to Ref).`);
                } 
                else if (type === '4') {
                    const k = parseInt(document.getElementById('bus-k').value) - 1;
                    if (isNaN(k) || k < 0 || k >= busCount || k === j) {
                        logMsg("Invalid Existing Bus (k) or k = j.", true);
                        return;
                    }
                    const denom = math.add(math.subtract(math.add(Z[j][j], Z[k][k]), math.multiply(2, Z[j][k])), zb);
                    let Z_new = [];
                    for (let r = 0; r < busCount; r++) {
                        let row = [];
                        for (let c = 0; c < busCount; c++) {
                            const d_col = math.subtract(Z[r][j], Z[r][k]);
                            const d_row = math.subtract(Z[j][c], Z[k][c]);
                            const delta = math.divide(math.multiply(d_col, d_row), denom);
                            row.push(math.subtract(Z[r][c], delta));
                        }
                        Z_new.push(row);
                    }
                    Z = Z_new;
                    logMsg(`Type 4 Modification Applied (Bus ${j + 1} to Bus ${k + 1}).`);
                }
            }
            renderMatrix();
        }

        // Initialize UI on load
        updateFormUI();
    </script>
</body>
</html>
