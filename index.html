<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z-bus Modification Portal</title>
<style>
:root{--bg:#f3f5f7;--panel:#ffffff;--ink:#14202b;--mute:#5c6b78;--line:#cdd6de;--accent:#0b6e8a;--accent-ink:#ffffff;--warn:#b3261e;--cell:#eef3f6}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--panel:#18222b;--ink:#e6edf2;--mute:#93a3b0;--line:#2c3a46;--accent:#4cc3e0;--accent-ink:#06222b;--warn:#ff8a80;--cell:#1f2c37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif;padding:20px}
main{max-width:1100px;margin:0 auto;display:grid;gap:16px}
h1{font-size:1.5rem;margin:0}
h2{font-size:1.05rem;margin:0 0 10px}
p.sub{margin:4px 0 0;color:var(--mute)}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:3px}
input,select,button{font:inherit;color:inherit}
input,select{background:var(--cell);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:5px;padding:8px 14px;cursor:pointer;font-weight:600}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.grid-wrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse}
td,th{padding:3px}
th{color:var(--mute);font-weight:600;font-size:.8rem}
.inp td input{width:105px;text-align:center}
.out td.v{border:1px solid var(--line);background:var(--cell);padding:6px 10px;text-align:center;font-family:Consolas,monospace;font-size:.85rem;white-space:nowrap}
.msg{color:var(--warn);min-height:1.3em;margin-top:8px}
.hint{color:var(--mute);font-size:.85rem;margin-top:6px}
#log{margin:0;padding-left:20px;color:var(--mute)}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <header>
    <h1>Z-bus Modification Portal</h1>
    <p class="sub">Enter the Z-bus of an N-bus system, then apply topology changes. Bus 0 is the reference (ground). Impedances are complex, e.g. <code>j0.25</code>, <code>0.1+j0.4</code>, <code>0.1-0.4j</code>.</p>
  </header>

  <section>
    <h2>1. Initial Z-bus</h2>
    <div class="row">
      <div><label for="n">Number of buses N (0 = start from empty network)</label><input id="n" type="number" min="0" max="30" value="3"></div>
      <button id="mk">Create matrix grid</button>
      <button id="load" class="alt">Use entered matrix</button>
      <button id="sym" class="alt">Mirror upper to lower triangle</button>
    </div>
    <div class="grid-wrap"><table class="inp" id="inp"></table></div>
    <div class="msg" id="m1"></div>
  </section>

  <section>
    <h2>2. Topology change</h2>
    <div class="row">
      <div><label for="type">Type of change</label>
        <select id="type">
          <option value="1">Type 1: Add branch, new bus p to reference</option>
          <option value="2">Type 2: Add branch, new bus p to existing bus k</option>
          <option value="3">Type 3: Add branch, existing bus k to reference</option>
          <option value="4">Type 4: Add branch, existing bus j to existing bus k</option>
          <option value="5">Type 5: Change or remove an existing branch j-k</option>
        </select></div>
      <div id="fP"><label for="p">New bus p</label><input id="p" type="number" style="width:80px"></div>
      <div id="fJ"><label for="j">From bus j</label><input id="j" type="number" min="0" style="width:80px" value="1"></div>
      <div id="fK"><label for="k">To bus k</label><input id="k" type="number" min="0" style="width:80px" value="0"></div>
      <div id="fZ"><label for="z">Branch impedance Zb</label><input id="z" value="j0.2" style="width:130px"></div>
      <div id="fZo" class="hidden"><label for="zo">Old impedance</label><input id="zo" value="j0.2" style="width:130px"></div>
      <div id="fZn" class="hidden"><label for="zn">New impedance (blank = remove)</label><input id="zn" style="width:130px"></div>
      <button id="apply">Apply change</button>
      <button id="undo" class="alt">Undo last</button>
    </div>
    <div class="hint" id="hint"></div>
    <div class="msg" id="m2"></div>
  </section>

  <section>
    <h2>3. Current Z-bus <span id="dim" style="color:var(--mute);font-weight:400"></span></h2>
    <div class="row">
      <label style="margin:0">Display as
        <select id="fmt"><option value="rect">a + jb</option><option value="polar">magnitude ∠ angle°</option></select></label>
      <label style="margin:0">Decimals <input id="dec" type="number" min="0" max="8" value="4" style="width:60px"></label>
    </div>
    <div class="grid-wrap"><table class="out" id="out"></table></div>
    <h2 style="margin-top:16px">Change history</h2>
    <ol id="log"><li>No changes yet.</li></ol>
  </section>
</main>

<script>
/* ---------- complex arithmetic: numbers are [re, im] ---------- */
const C = {
  add:(a,b)=>[a[0]+b[0],a[1]+b[1]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1]],
  mul:(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]],
  div:(a,b)=>{const d=b[0]*b[0]+b[1]*b[1];if(d<1e-18)throw new Error("Division by zero (singular modification).");return[(a[0]*b[0]+a[1]*b[1])/d,(a[1]*b[0]-a[0]*b[1])/d]},
  neg:a=>[-a[0],-a[1]],
  abs:a=>Math.hypot(a[0],a[1])
};
function parseC(str){
  let s=String(str).replace(/\s+/g,"").replace(/[iI]/g,"j").toLowerCase();
  if(s==="")throw new Error("Empty value.");
  const terms=s.match(/[+-]?(?:j?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?j?|j)/g);
  if(!terms||terms.join("")!==s)throw new Error('Cannot read "'+str+'" as a complex number.');
  let re=0,im=0;
  for(const t of terms){
    const sign=t[0]==="-"?-1:1;
    const body=t.replace(/^[+-]/,"");
    const hasJ=body.includes("j");
    const num=body.replace("j","");
    const v=num===""?1:parseFloat(num);
    if(hasJ)im+=sign*v;else re+=sign*v;
  }
  return[re,im];
}
function fmt(c){
  const d=+$("dec").value;
  if($("fmt").value==="polar"){
    const m=C.abs(c),a=Math.atan2(c[1],c[0])*180/Math.PI;
    return m.toFixed(d)+" ∠ "+(m<1e-12?0:a).toFixed(Math.max(1,d-2))+"°";
  }
  const r=Math.abs(c[0])<1e-12?0:c[0],i=Math.abs(c[1])<1e-12?0:c[1];
  return r.toFixed(d)+(i<0?" - j":" + j")+Math.abs(i).toFixed(d);
}
const $=id=>document.getElementById(id);

/* ---------- state ---------- */
let Z=[];            // current Z-bus (N x N complex)
let history=[];      // stack of {Z, text}

/* ---------- initial matrix grid ---------- */
function buildGrid(){
  const n=Math.max(0,Math.min(30,parseInt($("n").value)||0));
  let h="<tr><th></th>";
  for(let c=1;c<=n;c++)h+="<th>Bus "+c+"</th>";
  h+="</tr>";
  for(let r=1;r<=n;r++){
    h+="<tr><th>Bus "+r+"</th>";
    for(let c=1;c<=n;c++)h+='<td><input data-r="'+(r-1)+'" data-c="'+(c-1)+'" aria-label="Z'+r+c+'" value="'+(r===c?"j0.1":"0")+'"></td>';
    h+="</tr>";
  }
  $("inp").innerHTML=n?h:"";
  $("m1").textContent=n?"":"Empty network selected. Click “Use entered matrix”, then add Type 1 branches from the reference.";
}
function loadMatrix(){
  try{
    const n=Math.max(0,parseInt($("n").value)||0);
    const M=Array.from({length:n},()=>Array(n).fill(null));
    $("inp").querySelectorAll("input").forEach(el=>{M[+el.dataset.r][+el.dataset.c]=parseC(el.value)});
    Z=M;history=[];
    $("log").innerHTML="<li>No changes yet.</li>";
    $("m1").textContent="";$("m2").textContent="";
    $("p").value=n+1;
    render();
  }catch(e){$("m1").textContent=e.message}
}
function mirror(){
  const els=[...$("inp").querySelectorAll("input")];
  const get=(r,c)=>els.find(e=>+e.dataset.r===r&&+e.dataset.c===c);
  els.forEach(e=>{const r=+e.dataset.r,c=+e.dataset.c;if(r>c)e.value=get(c,r).value});
}

/* ---------- Z-bus modification algorithms ---------- */
// Adds a fictitious row/column (index n) then returns the augmented matrix
function augment(M,col,zll){
  const n=M.length;
  const A=M.map((row,i)=>[...row,col[i]]);
  A.push([...col,zll]);
  return A;
}
// Kron reduction: eliminate last row/column
function kron(A){
  const n=A.length-1,piv=A[n][n];
  const R=[];
  for(let i=0;i<n;i++){
    R.push([]);
    for(let j=0;j<n;j++)R[i].push(C.sub(A[i][j],C.div(C.mul(A[i][n],A[n][j]),piv)));
  }
  return R;
}
const col=(M,k)=>M.map(r=>r[k-1]);        // k is 1-based bus number
function checkBus(b,n,name,allowZero){
  if(!Number.isInteger(b)||b<(allowZero?0:1)||b>n)throw new Error(name+" must be "+(allowZero?"0 (reference) or ":"")+"an existing bus between 1 and "+n+".");
}
function type1(M,Zb){                       // new bus p to reference
  const n=M.length,zero=Array(n).fill([0,0]);
  return augment(M,zero,Zb);
}
function type2(M,k,Zb){                     // new bus p to existing bus k
  return augment(M,col(M,k),C.add(M[k-1][k-1],Zb));
}
function type3(M,k,Zb){                     // existing bus k to reference (link)
  return kron(augment(M,col(M,k),C.add(M[k-1][k-1],Zb)));
}
function type4(M,j,k,Zb){                   // existing j to existing k (link)
  const cj=col(M,j),ck=col(M,k);
  const c=cj.map((v,i)=>C.sub(v,ck[i]));
  const zll=C.add(Zb,C.sub(C.add(M[j-1][j-1],M[k-1][k-1]),C.mul([2,0],M[j-1][k-1])));
  return kron(augment(M,c,zll));
}
function type4ref(M,j,k,Zb){ return k===0?type3(M,j,Zb):j===0?type3(M,k,Zb):type4(M,j,k,Zb); }

/* ---------- UI actions ---------- */
function applyChange(){
  $("m2").textContent="";
  try{
    const t=+$("type").value,n=Z.length;
    let R,text;
    if(t===1){
      const p=+$("p").value,Zb=parseC($("z").value);
      if(p!==n+1)throw new Error("New bus number must be "+(n+1)+" (next bus).");
      R=type1(Z,Zb);text="Type 1: added bus "+p+" to reference through Zb = "+fmt(Zb);
    }else if(t===2){
      const p=+$("p").value,k=+$("k").value,Zb=parseC($("z").value);
      if(p!==n+1)throw new Error("New bus number must be "+(n+1)+" (next bus).");
      checkBus(k,n,"Bus k",false);
      R=type2(Z,k,Zb);text="Type 2: added bus "+p+" to bus "+k+" through Zb = "+fmt(Zb);
    }else if(t===3){
      const k=+$("k").value,Zb=parseC($("z").value);
      checkBus(k,n,"Bus k",false);
      R=type3(Z,k,Zb);text="Type 3: added branch bus "+k+" to reference, Zb = "+fmt(Zb);
    }else if(t===4){
      const j=+$("j").value,k=+$("k").value,Zb=parseC($("z").value);
      checkBus(j,n,"Bus j",false);checkBus(k,n,"Bus k",false);
      if(j===k)throw new Error("Buses j and k must differ.");
      R=type4(Z,j,k,Zb);text="Type 4: added branch between bus "+j+" and bus "+k+", Zb = "+fmt(Zb);
    }else{
      const j=+$("j").value,k=+$("k").value;
      checkBus(j,n,"Bus j",true);checkBus(k,n,"Bus k",true);
      if(j===k)throw new Error("Buses j and k must differ.");
      const zo=parseC($("zo").value),zn=$("zn").value.trim();
      let zl;
      if(zn===""){zl=C.neg(zo);text="Type 5: removed branch "+j+"-"+k+" (Zold = "+fmt(zo)+")";}
      else{
        const znv=parseC(zn);
        zl=C.div(C.mul(zo,znv),C.sub(zo,znv));   // parallel element that turns Zold into Znew
        text="Type 5: branch "+j+"-"+k+" changed from "+fmt(zo)+" to "+fmt(znv);
      }
      R=type4ref(Z,j,k,zl);
      text+=" (equivalent added link Zl = "+fmt(zl)+")";
    }
    history.push({Z,text});
    Z=R;
    $("log").innerHTML=history.map(h=>"<li>"+h.text+"</li>").join("");
    $("p").value=Z.length+1;
    render();
  }catch(e){$("m2").textContent=e.message}
}
function undo(){
  if(!history.length){$("m2").textContent="Nothing to undo.";return}
  Z=history.pop().Z;
  $("log").innerHTML=history.length?history.map(h=>"<li>"+h.text+"</li>").join(""):"<li>No changes yet.</li>";
  $("p").value=Z.length+1;$("m2").textContent="";render();
}
function render(){
  const n=Z.length;
  $("dim").textContent="("+n+" × "+n+")";
  if(!n){$("out").innerHTML="<tr><td>The matrix is empty. Add a Type 1 branch to create bus 1.</td></tr>";return}
  let h="<tr><th></th>"+Z.map((_,i)=>"<th>Bus "+(i+1)+"</th>").join("")+"</tr>";
  Z.forEach((row,i)=>{h+="<tr><th>Bus "+(i+1)+"</th>"+row.map(c=>'<td class="v">'+fmt(c)+"</td>").join("")+"</tr>"});
  $("out").innerHTML=h;
}
function syncForm(){
  const t=+$("type").value;
  const show=(id,v)=>$(id).classList.toggle("hidden",!v);
  show("fP",t===1||t===2);
  show("fJ",t===4||t===5);
  show("fK",t!==1);
  show("fZ",t!==5);show("fZo",t===5);show("fZn",t===5);
  $("hint").textContent={
    1:"New bus p connects to the reference. Z(p,p) = Zb; other new entries are 0.",
    2:"New bus p connects to existing bus k. New row/column = column k of Zbus; Z(p,p) = Z(k,k) + Zb.",
    3:"Link from bus k to reference. Augment with Z(k,k)+Zb, then eliminate the extra row/column (Kron reduction).",
    4:"Link between buses j and k. New row = Z(i,j) − Z(i,k); Z(l,l) = Zb + Z(j,j) + Z(k,k) − 2Z(j,k); then Kron reduction.",
    5:"Enter the existing branch impedance and its new value. The change is applied as a parallel link Zl = Zold·Znew/(Zold − Znew). Leave the new value blank to remove the branch (Zl = −Zold). Use bus 0 for a branch to reference."
  }[t];
}

$("mk").onclick=buildGrid;$("load").onclick=loadMatrix;$("sym").onclick=mirror;
$("apply").onclick=applyChange;$("undo").onclick=undo;
$("type").onchange=syncForm;$("fmt").onchange=render;$("dec").onchange=render;
buildGrid();syncForm();loadMatrix();
</script>
</body>
</html>
